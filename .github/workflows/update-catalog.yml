name: Actualizar catálogo

# Cada mes descarga datos públicos, regenera los catálogos livianos de src/data/generated,
# los valida y prueba, y sólo si todo pasa los publica en main. La app los descarga desde ahí.
on:
  schedule:
    - cron: '0 6 1 * *' # día 1 de cada mes, 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Los scripts de datos no necesitan Electron: se omiten los scripts de instalación.
      - run: npm ci --ignore-scripts

      - name: Descargar fuentes públicas
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/blender.zip" https://opendata.blender.org/snapshots/opendata-latest.zip
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/open-gpu-db.json" https://raw.githubusercontent.com/onepunk/open-gpu-db/main/dist/catalog.json
          ls -lh "$RUNNER_TEMP"

      - name: Generar catálogos
        run: unzip -p "$RUNNER_TEMP/blender.zip" '*.jsonl' | node scripts/import-external.js --open-gpu-db "$RUNNER_TEMP/open-gpu-db.json"

      - run: node scripts/build-manifest.js
      - run: npm run validate
      - run: npm test

      - name: Publicar si hay cambios
        run: |
          if git diff --quiet -- src/data; then
            echo "Sin cambios en el catálogo."
            exit 0
          fi
          git config user.name "hardscope-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          git commit -m "Catálogo: datos públicos actualizados ($(date -u +%Y-%m-%d))"
          git push
